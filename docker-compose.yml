services:

  postgres:
    image: postgres:16
    container_name: sales-agent-postgres
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales123
      POSTGRES_DB: sales_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sales-agent-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
